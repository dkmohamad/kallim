[project]
name = "kallim"
version = "0.1.0"
description = "Arabic language learning toolkit"
requires-python = ">=3.12"
dependencies = [
    "elevenlabs>=1.0.0",
    "genanki>=0.13.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
kallim = "cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=8.0",
    "ruff>=0.15",
]

[tool.setuptools]
py-modules = ["cli"]
packages = ["scripts"]

[tool.ruff.lint]
# Keep all imports at module top-level (no lazy in-function imports)
select = ["PLC0415"]

[tool.ruff.lint.per-file-ignores]
# The one sanctioned exception: audio.py and store.py lazily import their heavy
# third-party dep (pydub) inside the methods that use it, so commands that don't
# touch audio (lint, prune, --help) don't pay to load it on startup. audio.py
# also lazy-imports elevenlabs; store.py's AudioCache lazy-imports pydub to
# decode cached clips.
"scripts/audio.py" = ["PLC0415"]
"scripts/store.py" = ["PLC0415"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
