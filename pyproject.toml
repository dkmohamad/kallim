[project]
name = "kallim"
version = "0.1.0"
description = "Arabic language learning toolkit"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.39.0",
    "elevenlabs>=1.0.0",
    "genanki>=0.13.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
kallim = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
packages = ["scripts"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
